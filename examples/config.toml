# niraboard configuration
#
# Copy this file to:
#   $XDG_CONFIG_HOME/niraboard/config.toml
#   (~/.config/niraboard/config.toml when XDG_CONFIG_HOME is unset)
#
# A missing file is fine; every setting below shows its default value.

# Card layout used at startup: "vertical", "horizontal",
# "2-columns", or "3-columns".
layout = "vertical"

# Cards in display order. Available names:
# "battery", "cpu", "memory", "disk", "network", "power", "brightness", "audio".
# Remove a name to hide that card. Cards are drawn in this order; any card
# that does not fit on the current screen is not shown.
cards = [
    "battery",
    "cpu",
    "memory",
    "disk",
    "network",
    "power",
    "brightness",
    "audio",
]

[clock]
# Show the clock and date in the header, left of the NIRABOARD title.
enabled = true

# strftime-style format for the current local time. Common specifiers:
# %Y year, %m month, %d day, %e space-padded day,
# %H hour (24h), %I hour (12h), %M minute, %S second, %p AM/PM,
# %a / %A short / full weekday, %b / %B short / full month,
# %F date (%Y-%m-%d), %T time (%H:%M:%S), %R time (%H:%M),
# %z UTC offset, %% literal percent sign.
format = "%Y-%m-%d %H:%M"

[colors]
# Accent used for the header, focused borders, buttons, and key hints.
# Accepts colour names (cyan, light-blue, ...), an ANSI index (0-255),
# or a hexadecimal value such as "#4fc3f7".
main = "cyan"

# Normal fill colour of gauges. Warning and critical states use
# warn / bad below.
bar = "green"

# Regular values shown in cards.
text = "gray"

# Labels, hints, and secondary information.
muted = "dark-gray"

# State colours: connected/healthy, warning, and critical/error.
ok = "green"
warn = "yellow"
bad = "red"

[steps]
# Percentage changed by one brightness / volume adjustment.
# Valid values are 1-100.
brightness = 5
volume = 5
