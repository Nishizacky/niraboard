[package]
name = "niraboard"
version = "0.1.0"
edition = "2024"
description = "A compact laptop power dashboard for the terminal"
license = "MIT"

[dependencies]
anyhow = "1.0"
ratatui = "0.30.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
